schema_version: 1

context:
  name: fastgit
  version: "0.1.3"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fastgit-${{ version }}.tar.gz
  sha256: 77a61b6d10db467d3fc62dd52111c236cfb6c0ed04b4a5c171cdc1cab3169269

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - pip
  run:
    - python >=${{ python_min }}
    # Needs to be >2.0 though not spelled out upstream
    - fastcore >=2

tests:
  - python:
      imports:
        - fastgit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Use git from python, fast
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/AnswerDotAI/fastgit

extra:
  recipe-maintainers:
    - thewchan

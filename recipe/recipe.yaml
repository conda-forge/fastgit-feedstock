schema_version: 1

context:
  name: fastgit
  version: "0.1.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fastgit-${{ version }}.tar.gz
  sha256: 8728e6dfb70de57a8f58758d4e66192f3450a3177a7a56ee0c532fcd24d13d9e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - pip
  run:
    - python >=${{ python_min }}
    # Needs to be >2.0 though not spelled out upstream
    - fastcore >=2

tests:
  - python:
      imports:
        - fastgit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Use git from python, fast
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/AnswerDotAI/fastgit

extra:
  recipe-maintainers:
    - thewchan

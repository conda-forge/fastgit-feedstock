schema_version: 1

context:
  name: fastgit
  version: "0.0.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fastgit-${{ version }}.tar.gz
  sha256: 9e41c66ec09a71eefa3e6ff32c6ede9f067be529b0e49661b51ad2188ccbb5f9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - pip
  run:
    - python >=${{ python_min }}
    # Not listed but needed for import
    - fastcore

tests:
  - python:
      imports:
        - fastgit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Use git from python, fast
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/AnswerDotAI/fastgit

extra:
  recipe-maintainers:
    - thewchan
